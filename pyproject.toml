[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "castep-adp"
version = "0.0.1"
authors = [
        {name = "Kit Brown", email = "kit.brown@york.ac.uk"}
]
maintainers = [
        {name = "Kit Brown", email = "kit.brown@york.ac.uk"}
]
description = "Calculates atomic deformation parameters from a CASTEP MD calculation."
readme = "README.md"

requires-python = ">=3.11"

dependencies = [
    "numpy >= 2.1.0",
    "scipy >= 1.13.1",
    "pint >= 0.22",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]
lint = ["ruff>=0.15.2,<1.0"]

[project.scripts]
castep-adp = "castep_adp.cli:main"

